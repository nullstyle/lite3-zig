name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install tools with mise
        run: mise install

      - name: Check formatting
        run: mise exec -- zig fmt --check build.zig build.zig.zon src examples

      - name: Lint project C sources (-Werror)
        run: mise exec -- zig build lint-c

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe, ReleaseFast]
        json: [true, false]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install tools with mise
        run: mise install

      - name: Build
        run: mise exec -- zig build

      # In Debug and ReleaseSafe the vendored C library is built in the same
      # mode, so these runs exercise it under UBSan.
      - name: Test (${{ matrix.optimize }}, json=${{ matrix.json }})
        run: mise exec -- zig build test -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}

      - name: Upstream lite3 C tests (${{ matrix.optimize }}, json=${{ matrix.json }})
        run: mise exec -- zig build test-upstream -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}

      - name: Build examples (${{ matrix.optimize }}, json=${{ matrix.json }})
        run: mise exec -- zig build examples -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}

      - name: Run examples (${{ matrix.optimize }}, json=${{ matrix.json }})
        run: |
          mise exec -- ./zig-out/bin/basic
          mise exec -- ./zig-out/bin/json_roundtrip

  valgrind:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        json: [true, false]
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install tools with mise
        run: mise install

      # valgrind cannot decode AVX-512, so pin a baseline CPU.
      - name: Test under valgrind (json=${{ matrix.json }})
        run: mise exec -- zig build test-valgrind -Dcpu=x86_64_v3 -Djson=${{ matrix.json }}

  lto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install tools with mise
        run: mise install

      - name: Test with LTO (ReleaseFast)
        run: mise exec -- zig build test -Dlto=true -Doptimize=ReleaseFast

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86-linux-musl
          - arm-linux-musleabihf
          - riscv64-linux-musl
          - aarch64-macos
          - x86_64-macos
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install tools with mise
        run: mise install

      # Compiles the library, tests, examples and benchmarks for the target.
      - name: Cross-compile (${{ matrix.target }})
        run: mise exec -- zig build check -Dtarget=${{ matrix.target }}
