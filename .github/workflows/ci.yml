name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: long fuzzing run and the Zig master canary.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Check formatting
        run: mise exec -- zig build fmt
      - name: Lint project C sources (-Werror)
        run: mise exec -- zig build lint-c
      - name: API docs build
        run: mise exec -- zig build docs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe, ReleaseFast]
        json: [true, false]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ matrix.optimize }}-${{ hashFiles('build.zig', 'build.zig.zon', '.mise.toml') }}
          restore-keys: zig-${{ runner.os }}-${{ matrix.optimize }}-
      # In Debug and ReleaseSafe the vendored C library is built in the same
      # mode, so these runs exercise it under UBSan.
      - name: Test
        run: mise exec -- zig build test -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}
      - name: Upstream lite3 C tests
        run: mise exec -- zig build test-upstream -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}
      - name: Run examples and the README quick start
        run: mise exec -- zig build run-examples -Doptimize=${{ matrix.optimize }} -Djson=${{ matrix.json }}

  # 32-bit and static-musl builds, run natively on the x86_64 runner.
  musl:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, x86-linux-musl]
        json: [true, false]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Test (${{ matrix.target }})
        run: mise exec -- zig build test -Dtarget=${{ matrix.target }} -Djson=${{ matrix.json }}

  valgrind:
    strategy:
      fail-fast: false
      matrix:
        json: [true, false]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      # valgrind cannot decode AVX-512, so pin a baseline CPU.
      - name: Test under valgrind
        run: mise exec -- zig build test-valgrind -Dcpu=x86_64_v3 -Djson=${{ matrix.json }}

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - "fuzz: mutated documents"
          - "fuzz: arbitrary bytes"
          - "fuzz: JSON decoding"
          - "fuzz: any sequence of writes"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      # Coverage instrumentation needs the LLVM backend, hence ReleaseSafe
      # (which also runs the C library under UBSan). Short on pushes and
      # pull requests, long nightly.
      - name: Fuzz (${{ matrix.target }})
        run: >-
          mise exec -- zig build test -Doptimize=ReleaseSafe
          "-Dtest-filter=${{ matrix.target }}"
          --fuzz=${{ github.event_name == 'schedule' && '20M' || '200K' }}

  lto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Test with LTO (ReleaseFast)
        run: mise exec -- zig build test -Dlto=true -Doptimize=ReleaseFast

  cross-compile:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-gnu
          - arm-linux-musleabihf
          - riscv64-linux-musl
          - aarch64-macos
          - x86_64-macos
          - wasm32-wasi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      # Compiles the library, tests, examples and benchmarks for the target.
      - name: Cross-compile (${{ matrix.target }})
        run: mise exec -- zig build check -Dtarget=${{ matrix.target }}

  # Depend on the package the way users do: from a git archive tarball.
  consumer:
    runs-on: ubuntu-latest
    # Room for a slow toolchain download (seen to take ~20 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Build a consumer package (JSON on and off)
        run: mise exec -- scripts/consumer-test.sh

  # Early warning for the next Zig release. Never blocks.
  zig-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Test with Zig master
        run: |
          mise use --path .mise.local.toml zig@master
          mise exec -- zig version
          mise exec -- zig build test
